name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Byte-compile the Python tree
        run: python -m compileall -q naukri_bot main.py run_local.py run_naukri_unattended.py tools

      - name: Scan tracked files for secrets
        shell: bash
        run: |
          python - <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          allowed = {"config.example.json", "enhanced_config.example.json"}
          patterns = {
              "google_api_key": re.compile(r"AI" + r"za[0-9A-Za-z_\-]{35}"),
              "github_token": re.compile(r"gh[pousr]_[A-Za-z0-9]{36,}"),
              "aws_access_key": re.compile(r"AKIA[0-9A-Z]{16}"),
              "private_key": re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----"),
              "slack_token": re.compile(r"xox[baprs]-[0-9A-Za-z-]{10,}"),
              "personal_windows_path": re.compile(r"C:\\Users\\[^\s\"']+"),
              "candidate_ref": re.compile(r"candidate" + "_" + r"id", re.IGNORECASE),
          }
          password = re.compile(r"(?i)\bpassword\b\s*[:=]\s*[\"']([^\"']{6,})[\"']")
          allow_words = ("your", "example", "placeholder", "changeme", "enter_", "paste", "<", "xxx")

          raw_files = subprocess.run(
              ["git", "ls-files", "-z"], check=True, capture_output=True
          ).stdout.split(b"\0")
          files = [f.decode() for f in raw_files if f]
          failures = []

          for path in files:
              if path in allowed or path.startswith(".github/workflows/"):
                  continue
              p = Path(path)
              if not p.is_file():
                  continue
              text = p.read_text(encoding="utf-8", errors="replace")
              for name, rx in patterns.items():
                  for match in rx.finditer(text):
                      line = text.count("\n", 0, match.start()) + 1
                      failures.append(f"{path}:{line}: {name}")
              for match in password.finditer(text):
                  value = match.group(1).lower()
                  if not any(word in value for word in allow_words):
                      line = text.count("\n", 0, match.start()) + 1
                      failures.append(f"{path}:{line}: password literal")

          if failures:
              print("Potential secrets found:")
              print("\n".join(failures))
              sys.exit(1)

          print(f"Scanned {len(files)} tracked files: no secrets found")
          PY
